version: '3.8'
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: personal_profile_db_pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: personal_profile_prototype
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: personal_profile_redis_new
    ports:
      - "6380:6379"
      
volumes:
  pgdata:
